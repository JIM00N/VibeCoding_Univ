<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진료 기록 작성 (직원/의사)</title>
<style>
  :root{
    --primary:#047857; --primary-fg:#fff; --primary-tint:#ecfdf5;
    --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ring:#047857; --danger:#dc2626;
    --confirm-fg:#1e40af; --confirm-bg:#dbeafe;
    --done-fg:#166534; --done-bg:#dcfce7;
    --radius:8px; --radius-sm:6px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55}
  .rolebar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px}
  .rolebar .tag{background:#f1f5f9;color:#334155;font-weight:700;padding:3px 10px;border-radius:999px;font-size:12px}
  .rolebar .who{color:var(--ink);font-weight:600}
  .rolebar .switch{margin-left:auto;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  /* target appt card */
  .appt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .appt .k{font-size:12px;color:var(--muted)}
  .appt .v{font-size:14px;font-weight:600}
  .appt .col{display:flex;flex-direction:column;gap:1px}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
  .badge.confirm{color:var(--confirm-fg);background:var(--confirm-bg)}
  .badge.done{color:var(--done-fg);background:var(--done-bg)}
  .arrow{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field label .req{color:var(--danger)}
  input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
  textarea{resize:vertical;min-height:70px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:var(--ring)}
  /* prescription rows */
  .rxhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rxhead h2{margin:0}
  .rxhead .addbtn{font-size:13px;color:var(--primary);font-weight:700;background:var(--primary-tint);border:1px solid #a5f3fc;border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer}
  .rx{display:grid;grid-template-columns:2fr 1.6fr .9fr 32px;gap:8px;align-items:center;margin-bottom:8px}
  .rx .sel{position:relative}
  .rx small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .rx .del{width:32px;height:38px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--danger);cursor:pointer;font-size:15px}
  .rxlabels{display:grid;grid-template-columns:2fr 1.6fr .9fr 32px;gap:8px;font-size:11px;color:var(--muted);margin-bottom:4px}
  .empty-rx{font-size:12.5px;color:var(--muted);padding:6px 0}
  /* actions */
  .actions{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;padding:13px;background:var(--primary);color:var(--primary-fg);border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.ghost{flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .callout{margin-top:14px;background:var(--done-bg);border:1px solid #86efac;border-radius:var(--radius);padding:11px 14px;font-size:12.8px;color:#14532d}
  .callout b{color:var(--done-fg)}
  @media(max-width:560px){.rx,.rxlabels{grid-template-columns:1fr 1fr}.rx .del{grid-column:2;justify-self:end}}
</style>
</head>
<body>
  <div class="rolebar">
    <span class="tag">직원</span>
    <span class="who">진료 기록 작성 · 김민재 선생님</span>
    <span class="switch">역할 바꾸기</span>
  </div>
  <div class="wrap">
    <h1>진료 기록 작성</h1>
    <p class="sub">확정된 예약에 진단·소견·처방을 남깁니다. 저장하면 이 예약은 완료로 바뀌어요.</p>

    <div class="appt">
      <div class="col"><span class="k">환자</span><span class="v">이수민</span></div>
      <div class="col"><span class="k">예약</span><span class="v">7/14 10:30 · 이비인후과</span></div>
      <div class="col"><span class="k">담당</span><span class="v">김민재</span></div>
      <div class="col"><span class="k">상태</span>
        <span><span class="badge confirm">확정</span> <span class="arrow">→</span> <span class="badge done">완료</span></span>
      </div>
    </div>

    <div class="card">
      <h2>진료 내용</h2>
      <div class="field">
        <label>진단명 <span class="req">*</span></label>
        <input type="text" value="급성 인두염">
      </div>
      <div class="field">
        <label>소견</label>
        <textarea>인후 발적, 발열 동반. 수분 섭취 권장, 3일 후 경과 관찰.</textarea>
      </div>
      <div class="field">
        <label>진료 일시</label>
        <input type="text" value="2026-07-14 10:35" readonly>
      </div>
    </div>

    <div class="card">
      <div class="rxhead">
        <h2>처방 <span style="color:var(--muted);font-weight:400;font-size:13px">(0개 이상)</span></h2>
        <button class="addbtn">+ 처방 추가</button>
      </div>
      <div class="rxlabels"><span>약</span><span>용법·용량</span><span>일수</span><span></span></div>
      <div class="rx">
        <div class="sel"><select><option>아목시실린 500mg</option><option>이부프로펜 200mg</option></select></div>
        <div><input type="text" value="1일 3회 식후"></div>
        <div><input type="text" value="3"></div>
        <button class="del" title="삭제">✕</button>
      </div>
      <div class="rx">
        <div class="sel"><select><option>이부프로펜 200mg</option><option>아목시실린 500mg</option></select></div>
        <div><input type="text" value="1일 2회 통증 시"></div>
        <div><input type="text" value="3"></div>
        <button class="del" title="삭제">✕</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn ghost">취소</button>
      <button class="btn">기록 저장</button>
    </div>
    <div class="callout">💡 저장 순간, 이 예약은 <b>확정 → 완료</b>로 자동 전이됩니다(같은 트랜잭션). 한 예약엔 진료 기록 1건만 저장돼요.</div>
  </div>
</body>
</html>
