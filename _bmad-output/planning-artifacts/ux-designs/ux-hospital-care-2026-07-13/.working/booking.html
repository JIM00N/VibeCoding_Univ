<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 잡기 — 슬롯 피커 (환자)</title>
<style>
  :root{
    --primary:#0E7490; --primary-fg:#fff; --primary-tint:#ecfeff;
    --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ring:#0E7490; --danger:#dc2626; --danger-bg:#fef2f2;
    --wait-fg:#92400e; --wait-bg:#fef3c7;
    --radius:8px; --radius-sm:6px;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55}
  /* role context bar */
  .rolebar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:13px}
  .rolebar .tag{background:var(--primary-tint);color:var(--primary);font-weight:700;padding:3px 10px;border-radius:999px;font-size:12px;flex:none}
  .rolebar .who{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .rolebar .switch{margin-left:auto;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;flex:none}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  /* demo banner */
  .demo{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:var(--radius);padding:10px 12px;font-size:12.5px;margin-bottom:18px}
  h1{font-size:22px;margin:6px 0 2px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field label .req{color:var(--danger)}
  select,input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--ink);font-family:inherit;appearance:none}
  select:focus,input:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:var(--ring)}
  .select-wrap{position:relative}
  .select-wrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
  /* slot grid */
  .slotsec{margin-top:6px;min-width:0}
  .slotsec .cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
  .slotsec .cap b{font-size:13px;flex:none}
  .slotsec .cap span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:100%}
  @media(max-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .slot{padding:10px 0;text-align:center;font-size:13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
  .slot:hover{border-color:var(--primary)}
  .slot.sel{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:700}
  .slot.taken{background:#f1f5f9;color:#94a3b8;border-color:var(--line);cursor:not-allowed;text-decoration:line-through}
  .slot.taken small{display:block;font-size:9.5px;text-decoration:none;margin-top:1px}
  .legend{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
  /* footer action */
  .summary{margin-top:22px;background:var(--primary-tint);border:1px solid #a5f3fc;border-radius:var(--radius);padding:12px 14px;font-size:13px}
  .summary b{color:var(--primary)}
  .btn{margin-top:14px;width:100%;padding:13px;background:var(--primary);color:var(--primary-fg);border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.05)}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
  <div class="rolebar">
    <span class="tag">환자</span>
    <span class="who">이수민님</span>
    <span class="switch">역할/환자 바꾸기</span>
  </div>
  <div class="wrap">
    <div class="demo"><b>⚠️ 데모 안내</b> — 지금은 로그인이 없어 누구나 목록에서 환자를 고를 수 있어요. 실제 보안이 아닙니다.</div>

    <h1>예약 잡기</h1>
    <p class="sub">진료과와 담당 의사, 시간을 골라 예약해요.</p>

    <div class="field">
      <label>진료과 <span class="req">*</span></label>
      <div class="select-wrap"><select><option>이비인후과</option><option>내과</option><option>정형외과</option></select></div>
    </div>

    <div class="field">
      <label>담당 의사 <span class="req">*</span></label>
      <div class="select-wrap"><select><option>김민재 선생님</option><option>박지훈 선생님</option></select></div>
    </div>

    <div class="field">
      <label>날짜 <span class="req">*</span></label>
      <input type="text" value="2026-07-14 (월)" readonly>
    </div>

    <div class="slotsec">
      <div class="cap"><b>시간 선택 (30분 단위)</b><span>김민재 선생님 · 7/14</span></div>
      <div class="grid">
        <div class="slot">09:00</div>
        <div class="slot taken">09:30<small>예약됨</small></div>
        <div class="slot">10:00</div>
        <div class="slot sel">10:30</div>
        <div class="slot">11:00</div>
        <div class="slot taken">11:30<small>예약됨</small></div>
        <div class="slot">14:00</div>
        <div class="slot">14:30</div>
      </div>
      <div class="legend">
        <span><i class="sw" style="background:#fff"></i> 예약 가능</span>
        <span><i class="sw" style="background:var(--primary)"></i> 선택됨</span>
        <span><i class="sw" style="background:#f1f5f9"></i> 예약됨(비활성)</span>
      </div>
    </div>

    <div class="summary">📅 <b>7월 14일(월) 10:30</b> · 이비인후과 · 김민재 선생님으로 예약합니다.</div>
    <button class="btn">예약하기</button>
    <p class="note">예약 직후 상태는 <b>대기</b>로 시작해요. 직원이 확정하면 확정으로 바뀝니다.</p>
  </div>
</body>
</html>
