# 버그 잡이용 최소 린트. 스타일·포매팅 룰은 넣지 않아요 — 포매터 미도입이고 전체 재포맷은 금지예요.
# 이 설정으로 현재 코드베이스는 검출 0건이라, 뜨는 경고는 전부 새로 생긴 것이에요.

# .python-version(3.13)을 ruff가 읽지 못해요. 명시하지 않으면 py39로 추론해 최신 룰이 조용히 꺼져요.
target-version = "py313"

[lint]
# E4 import · E7 문장 · E9 구문 오류 / F 미사용·미정의 / B 흔한 함정 / ASYNC 비동기 오용 / UP 구식 문법
# E501(줄 길이)은 제외 — 한국어 주석·긴 SQL 리터럴이라 수백 건이 뜨고 전부 무의미해요.
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "UP"]

# timezone.utc → datetime.UTC 전환. slots.py의 naive/UTC 계약 테스트를 건드려서 보류해요.
ignore = ["UP017"]
